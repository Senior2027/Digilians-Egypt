<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ID Egypt | شهادة البكالوريوس الرقمية</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
.cert{max-width:880px;margin:0 auto;text-align:center;font-size:1.45rem;line-height:2.1}
.cert .ttl{font-size:clamp(2rem,6vw,3.2rem);color:#7a1020;margin:8px 0;font-weight:800}
.cert .thesis{background:#f2ecda;border:1px dashed #b08d3c;padding:14px 20px;margin:18px auto;max-width:90%;font-style:italic;font-size:1.25rem}
.cert .foot{justify-content:space-around;margin-top:36px}
.cert .emb{width:96px;height:96px;border:4px solid #b08d3c;color:#b08d3c;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.8rem;font-weight:800;transform:rotate(-12deg);background:#fff;line-height:1.3}
.cert .sig{font-size:1.1rem}
</style>
</head>
<body>
<main class="page" id="main">
  <div class="crumbs"><a href="index.html">الرئيسية</a> › التعليم العالي › شهادة البكالوريوس / الليسانس</div>
  <div class="page-head"><div><h1>🎓 شهادة البكالوريوس / الليسانس</h1><p>وزارة التعليم العالي والبحث العلمي</p></div>
    <div class="btn-row no-print" style="margin:0"><button class="button ghost" id="edit" type="button">✏️ تحديث السجل الأكاديمي</button><button class="button" type="button" onclick="window.print()">🖨️ طباعة</button></div></div>
  <div id="view"></div>
</main>
<script src="assets/js/qr.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/shell.js"></script>
<script>
NCC.shell();
ID.ready(function (u, D) {
  const v = document.getElementById('view'), x = D.uniInfo(), e = ID.esc, LEVEL = 1;
  document.getElementById('edit').onclick = () => ID.academicDialog().then(ok => ok && location.reload());
  if (!x.has || x.level < LEVEL) {
    v.innerHTML = '<div class="box empty"><span class="em">📭</span><h3>لا يوجد سجل أكاديمي مسجل</h3><p>أضف بياناتك الأكاديمية من زر «تحديث السجل الأكاديمي» ليظهر هذا المستند.</p></div>'; return;
  }
  const logoImg = '<img class="logo" src="assets/img/logo.png" alt="">', qrId = 'q';

  v.innerHTML = '<article class="paper cert"><div class="head">' + logoImg + '<h3>جمهورية مصر العربية</h3><h3>وزارة التعليم العالي والبحث العلمي</h3><h1 class="ttl">شهادة بكالوريوس</h1></div>' +
    'تشهد وزارة التعليم العالي بأن السيد/ <span class="val">' + e(u.name) + '</span><br>' +
    'المولود في محافظة: <span class="val">' + e(u.gov) + '</span> والمنتمي للجنسية المصرية،<br>' +
    'والحامل للرقم القومي: <span class="val">' + u.nid + '</span><br>' +
    'قد نال درجة البكالوريوس من كلية <span class="val">' + e(x.faculty) + '</span> - ' + e(x.uni) + '<br>' +
    'قسم: <span class="val">' + e(x.major) + '</span><br>' +
    'بتقدير عام: <span class="val">' + x.grade + '</span><br>' +
    'وذلك في دور يونيو لعام <span class="val">' + x.gradYear + '</span>.' +
    '<div class="foot"><div class="qr" id="q"></div><div class="emb">ID EGYPT<br>وثيقة مؤمنة</div><div class="sig">توقيع الوزير<br>__________</div></div></article>';
  ID.qr(document.getElementById(qrId), 'IDEGYPT-DEMO|UNI-' + LEVEL + '|' + ID.refCode(u.nid + 'uni' + LEVEL));
});
</script>
</body>
</html>
